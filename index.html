<!doctype html>
<html lang="fr">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMS Suivi de stock</title>
<link rel="icon" href="logo-ams.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --line:#dde3ea; --fg:#18222e; --muted:#5d6b7a;
  --accent:#d97400; --accent-fg:#ffffff; --accent-soft:#fdf1d6;
  --ok:#2f7d4f; --ok-soft:#e2f2e8; --warn:#1d5fa8; --warn-soft:#e3edf8; --bad:#b4232a; --bad-soft:#fbe1e2;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f151c; --surface:#17202a; --line:#2a3644; --fg:#e6ecf2; --muted:#9aa8b6;
  --accent:#e8890c; --accent-fg:#ffffff; --accent-soft:#3a2c0e;
  --ok:#5fc187; --ok-soft:#173226; --warn:#7fb0ea; --warn-soft:#1c2d42; --bad:#f07a7f; --bad-soft:#3d1a1c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:10px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.brand img{display:block;height:46px;width:auto}
.who{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px;color:var(--muted);flex-wrap:wrap}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 18px;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:0 2px 6px rgba(217,116,0,.35)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500;box-shadow:none}
.btn.small{padding:5px 10px;font-size:13px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default}
main{padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-size:20px;margin:0;margin-right:auto}
.bar input[type=search]{flex:1 1 220px}
h2.sec{font-size:16px;margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.chip b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.chip span{font-size:13px;color:var(--muted)}
.chip.bad b{color:var(--bad)} .chip.warn b{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-family:var(--mono)}
.sub{font-size:12px;color:var(--muted)}
.ref{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bas{background:var(--bad-soft);color:var(--bad)} .pill.haut{background:var(--warn-soft);color:var(--warn)} .pill.none{color:var(--muted)}
.cell{display:inline-block;min-width:30px;text-align:center;padding:2px 6px;border-radius:4px;font-family:var(--mono);position:relative}
.cell.bas{background:var(--bad-soft);color:var(--bad);font-weight:600} .cell.haut{background:var(--warn-soft);color:var(--warn)} .cell.zero{color:var(--muted)}
.cell.top{background:var(--ok-soft);color:var(--ok);font-weight:700}
.cell.alert::after{content:"";position:absolute;top:-2px;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
td.me,th.me{background:var(--accent-soft)}
.famrow td{background:var(--accent-soft);font-weight:700;cursor:pointer;border-top:2px solid var(--line)}
.famrow td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.famrow td.num{font-size:16px}
.tog{background:none;border:0;padding:0;font-weight:700;font-size:17px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-align:left}
.tog .chev{display:inline-block;width:12px;transition:transform .15s;color:var(--accent)}
.tog[aria-expanded="true"] .chev{transform:rotate(90deg)}
tr.child td:first-child{padding-left:34px}
table.fit{table-layout:fixed;min-width:640px}
table.fit td,table.fit th{white-space:normal;padding:8px 6px}
table.fit th:first-child{width:30%}
table.fit th{font-size:10.5px;letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.type{font-weight:600}
.type.entree{color:var(--ok)} .type.sortie{color:var(--bad)} .type.transfert{color:var(--accent)} .type.inventaire{color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:0}
.empty{padding:28px;text-align:center;color:var(--muted);white-space:normal}
.thin{width:72px;text-align:right}
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:20;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h2{margin:0;font-size:18px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);padding:4px;border-radius:8px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:6px;font-weight:500;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.step .lab{font-size:13px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.step{display:flex;flex-direction:column;gap:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;max-height:240px;overflow-y:auto}
.list button{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:8px 12px;cursor:pointer}
.list button:last-child{border-bottom:0}
.list button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
.picked{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--accent-soft)}
.preview{border-radius:8px;padding:10px 12px;font-size:14px;background:var(--bg)}
.preview.warn{background:var(--warn-soft);color:var(--warn)} .preview.bad{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.login{max-width:380px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login img{height:80px;width:auto;align-self:center}
.login h1{font-size:20px;margin:0;text-align:center}
.err{color:var(--bad);font-size:14px}
.demo{background:var(--accent-soft);font-size:13px;padding:6px 10px;border-radius:6px}
textarea{width:100%;min-height:140px;font-family:var(--mono);font-size:12px}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr}.who{margin-left:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .15s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
</style>
</head>

function emptyData(){return{familles:[],articles:[],stock:{},seuils:{},seuilsFam:{},mouvements:[],vehicules:[],users:[]}}

function applyMove(stock,m){ // retourne les nouvelles quantités {key:qte}
  const g=(ag)=>stock[key(m.articleId,ag)]?.qte||0, out={};
  if(m.type==='entree')out[key(m.articleId,m.ag)]=g(m.ag)+m.q;
  if(m.type==='sortie')out[key(m.articleId,m.ag)]=g(m.ag)-m.q;
  if(m.type==='transfert'){out[key(m.articleId,m.ag)]=g(m.ag)-m.q;out[key(m.articleId,m.to)]=g(m.to)+m.q}

function LocalBackend(){
  const K='ams-stock-demo-v2';let D,listeners=[],authCb=null,current=null;
  try{D=JSON.parse(localStorage.getItem(K))}catch(e){}

  const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){};listeners.forEach(f=>f(D))};
  const nid=()=>Math.random().toString(36).slice(2,10);
  return{
    demo:true,
    onAuth(cb){authCb=cb;setTimeout(()=>cb(current),0)},
    async login(email){current={uid:'demo-'+norm(email),email};if(!D.users.find(u=>u.id===current.uid))D.users.push({id:current.uid,email,role:'admin',agence:''});save();authCb(current)},
    async logout(){current=null;authCb(null)},
    subscribe(cb){listeners.push(cb);cb(D)},
    async profile(u){return D.users.find(x=>x.id===u.uid)},
    async mouvement(m){const up=applyMove(D.stock,m);for(const[k,q]of Object.entries(up)){const[a,ag]=k.split('__');D.stock[k]={articleId:a,agence:ag,qte:q}}
      D.mouvements.unshift({...m,id:nid()});save()},
    async setSeuil(a,min,max){if(min==null&&max==null)delete D.seuils[a];else D.seuils[a]={min,max};save()},
    async setSeuilFam(f,min,max){if(min==null&&max==null)delete D.seuilsFam[f];else D.seuilsFam[f]={famille:f,min,max};save()},
    async saveArticle(a){if(a.id){const i=D.articles.findIndex(x=>x.id===a.id);D.articles[i]={...D.articles[i],...a}}else D.articles.push({...a,id:nid()});save()},
    async saveArticles(list){for(const a of list)D.articles.push({...a,id:nid()});save()},
    async saveFamille(nom){D.familles.push({id:nid(),nom,ordre:D.familles.length});save()},
    async saveVehicule(v){D.vehicules.push({...v,id:nid()});save()},
    async setUser(id,p){const u=D.users.find(x=>x.id===id);Object.assign(u,p);save()},

    D.articles.push({id:'e'+i,famille:'Meubles Edström',ref,designation:d,fournisseur:'Edström',marque:'',modele:'',version:'',actif:true}));
  for(const a of D.articles)for(const ag of AGENCES){const main=ag==='Chartres';
    const q=main?Math.floor(r()*4):(r()<.6?0:1+(r()<.2?1:0));D.stock[key(a.id,ag)]={articleId:a.id,agence:ag,qte:q}}
  D.seuilsFam={'Galerie':{famille:'Galerie',min:null,max:5},'Serrure Multilock':{famille:'Serrure Multilock',min:1,max:null}};
  D.seuils={e0:{min:1,max:null}};
  return D;
}

async function FirebaseBackend(cfg){
  const base=`https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  const {initializeApp}=await import(base+'firebase-app.js');
  const A=await import(base+'firebase-auth.js');
  const F=await import(base+'firebase-firestore.js');
  const app=initializeApp(cfg),auth=A.getAuth(app),fs=F.getFirestore(app);
  const D=emptyData();let listeners=[],unsubs=[];
  const emit=()=>listeners.forEach(f=>f(D));
  function listen(isAdmin){
    unsubs.forEach(u=>u());unsubs=[];
    const col=(name,fn,q)=>unsubs.push(F.onSnapshot(q||F.collection(fs,name),snap=>{fn(snap);emit()},err=>{console.error(name,err);toast('Erreur de lecture ('+name+') : '+err.code)}));
    col('familles',s=>D.familles=s.docs.map(d=>({id:d.id,...d.data()})));
    col('articles',s=>D.articles=s.docs.map(d=>({id:d.id,...d.data()})));
    col('vehicules',s=>D.vehicules=s.docs.map(d=>({id:d.id,...d.data()})));
    col('stock',s=>{D.stock={};s.docs.forEach(d=>D.stock[d.id]=d.data())});
    col('seuils',s=>{D.seuils={};s.docs.forEach(d=>D.seuils[d.id]=d.data())});
    col('seuilsFamilles',s=>{D.seuilsFam={};s.docs.forEach(d=>D.seuilsFam[d.data().famille]=d.data())});
    col('mouvements',s=>D.mouvements=s.docs.map(d=>({id:d.id,...d.data()})),F.query(F.collection(fs,'mouvements'),F.orderBy('date','desc'),F.limit(500)));
    if(isAdmin)col('users',s=>D.users=s.docs.map(d=>({id:d.id,...d.data()})));
  }
  return{
    demo:false,
    onAuth(cb){A.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,email:u.email}:null))},
    async login(email,pw){await A.signInWithEmailAndPassword(auth,email,pw)},
    async resetPassword(email){await A.sendPasswordResetEmail(auth,email)},
    async logout(){unsubs.forEach(u=>u());unsubs=[];await A.signOut(auth)},
    subscribe(cb){listeners.push(cb);cb(D)},
    async profile(u){
      const ref=F.doc(fs,'users',u.uid);let snap=await F.getDoc(ref);
      if(!snap.exists()){await F.setDoc(ref,{email:u.email,role:'attente',agence:'',creeLe:new Date().toISOString()});snap=await F.getDoc(ref)}
      const p={id:u.uid,...snap.data()};if(p.role!=='attente')listen(p.role==='admin');return p;
    },
    async mouvement(m){
      await F.runTransaction(fs,async tx=>{
        const ags=uniq([m.ag,m.to].filter(Boolean)),cur={};
        for(const ag of ags){const s=await tx.get(F.doc(fs,'stock',key(m.articleId,ag)));if(s.exists())cur[key(m.articleId,ag)]=s.data()}
        const up=applyMove(cur,m);
        for(const[k,q]of Object.entries(up)){const[a,ag]=k.split('__');tx.set(F.doc(fs,'stock',k),{articleId:a,agence:ag,qte:q})}
        tx.set(F.doc(F.collection(fs,'mouvements')),m);
      });
    },
    async setSeuil(a,min,max){const r=F.doc(fs,'seuils',a);if(min==null&&max==null)await F.deleteDoc(r);else await F.setDoc(r,{articleId:a,min,max})},
    async setSeuilFam(f,min,max){const r=F.doc(fs,'seuilsFamilles',encodeURIComponent(f));if(min==null&&max==null)await F.deleteDoc(r);else await F.setDoc(r,{famille:f,min,max})},
    async saveArticle(a){const{id,...d}=a;if(id)await F.updateDoc(F.doc(fs,'articles',id),d);else await F.addDoc(F.collection(fs,'articles'),d)},
    async saveArticles(list){for(let i=0;i<list.length;i+=400){const b=F.writeBatch(fs);list.slice(i,i+400).forEach(a=>b.set(F.doc(F.collection(fs,'articles')),a));await b.commit()}},
    async saveFamille(nom){await F.addDoc(F.collection(fs,'familles'),{nom,ordre:D.familles.length})},
    async saveVehicule(v){await F.addDoc(F.collection(fs,'vehicules'),v)},
    async setUser(id,p){await F.updateDoc(F.doc(fs,'users',id),p)},
    async initFamilles(){const b=F.writeBatch(fs);FAMILLES_DEFAUT.forEach((n,i)=>b.set(F.doc(F.collection(fs,'familles')),{nom:n,ordre:i}));await b.commit()}
  };
}

const familles=()=>{const f=[...D.familles].sort((a,b)=>(a.ordre??0)-(b.ordre??0)).map(f=>f.nom);
  return uniq([...f,...D.articles.map(a=>a.famille)].filter(Boolean))};
const actifs=()=>D.articles.filter(a=>a.actif!==false);
const art=id=>D.articles.find(a=>a.id===id);
const qte=(id,ag)=>D.stock[key(id,ag)]?.qte||0;
// Seuil appliqué à un article : la règle de sa famille, sauf exception propre à l'article. Identique dans toutes les agences.
function seuil(id){const a=art(id);if(!a)return;const f=D.seuilsFam[a.famille]||{},o=D.seuils[id]||{};
  const min=o.min??f.min??null,max=o.max??f.max??null;return(min==null&&max==null)?undefined:{min,max}}
const sum=(ids,ags)=>ids.reduce((s,id)=>s+ags.reduce((t,ag)=>t+qte(id,ag),0),0);
function etat(id,ag,q=qte(id,ag)){const t=seuil(id,ag);if(!t)return'none';if(t.min!=null&&q<t.min)return'bas';if(t.max!=null&&q>t.max)return'haut';return'ok'}
const PILL={ok:'OK',bas:'Stock bas',haut:'Surstock',none:'Pas de seuil'};
const vehOf=a=>a.marque?`${a.marque} ${a.modele}${a.version&&a.version!==TOUTES?' '+a.version:''}`:'';
const titre=a=>vehOf(a)||a.designation||a.ref||'(sans nom)';
const detail=a=>[a.ref,vehOf(a)?a.designation:''].filter(Boolean).join(' · ');
const fullLabel=a=>[a.famille,titre(a),detail(a)].filter(Boolean).join(' – ');
const allVehicules=()=>[...VEHICULES_DEFAUT.map(v=>({gabarit:v[0],marque:v[1],modele:v[2],version:v[3]})),...D.vehicules];
function groups(){const q=norm(fQ.trim());
  return familles().map(f=>({fam:f,items:actifs().filter(a=>a.famille===f&&(!q||norm(fullLabel(a)).includes(q))).sort((x,y)=>titre(x).localeCompare(titre(y),'fr'))})).filter(g=>g.items.length)}
const isOpen=f=>open.has(f)||!!fQ.trim();

async function importRows(){
  const lines=$('imp').value.split(/\r?\n/).map(l=>l.split('\t').map(c=>c.trim())).filter(c=>c.some(Boolean));
  const out=[],errs=[];
  lines.forEach((c,i)=>{const[ref,famille,marque,modele,version,designation,fournisseur]=c;
    if(!famille){errs.push(`ligne ${i+1} : famille manquante`);return}
    if(!marque&&!ref&&!designation){errs.push(`ligne ${i+1} : il faut un code, une désignation ou un véhicule`);return}
    out.push({ref:ref||'',famille,marque:marque||'',modele:modele||'',version:version||(marque?TOUTES:''),designation:designation||'',fournisseur:fournisseur||'',actif:true})});
  if(!out.length){$('impInfo').textContent=errs[0]||'Rien à importer.';return}
  for(const f of uniq(out.map(a=>a.famille)))if(!familles().includes(f))await B.saveFamille(f);
  await B.saveArticles(out);$('imp').value='';
  toast(`${out.length} article(s) importé(s)${errs.length?`, ${errs.length} ligne(s) ignorée(s)`:''}`);
}
function exportCsv(){
  const t=$('tbl');const rows=[...t.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replace('▸','').replace(/\s*\n\s*/g,' – ').trim().replace(/"/g,'""')+'"').join(';'));
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`AMS-stock-${view}-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();
  toast('Fichier exporté : ouvrez-le avec Excel');
}

/* ---------- Fenêtre « + Mouvement » ---------- */
const STEPS=[['marque','Marque'],['modele','Modèle'],['version','Version']];
const NONE='__none';
function openModal(){modal={type:'entree',ag:isAdmin()?viewAg:myAg(),to:'',fam:'',marque:'',modele:'',version:'',item:null,search:'',q:1,motif:MOTIFS[0],comment:''};drawModal()}
function candidates(){
  let c=actifs().filter(a=>a.famille===modal.fam);const steps=[];
  for(const[k,lab]of STEPS){
    if(k!=='marque'&&modal.marque===NONE)break;
    const vals=uniq(c.map(a=>a[k]||NONE));
    if(vals.length>1)steps.push({k,lab,vals});
    if(!modal[k]&&vals.length===1)modal[k]=vals[0];
    if(!modal[k])return{c,steps,stop:true};
    c=c.filter(a=>(a[k]||NONE)===modal[k]);
  }
  return{c,steps,stop:false};
}
function picker(){
  let h=`<div class="step"><span class="lab">Famille</span><div class="opts">${familles().map(f=>`<button type="button" data-fam="${esc(f)}" aria-pressed="${modal.fam===f}">${esc(f)}</button>`).join('')}</div></div>`;
  if(!modal.fam)return h;
  const{c,steps,stop}=candidates();
  for(const s of steps)h+=`<div class="step"><span class="lab">${s.lab}</span><div class="opts">${s.vals.map(v=>`<button type="button" data-k="${s.k}" data-v="${esc(v)}" aria-pressed="${modal[s.k]===v}">${v===NONE?'Sans véhicule':esc(v)}</button>`).join('')}</div></div>`;
  if(!stop){
    if(c.length===1)modal.item=c[0].id;
    else if(c.length>1){const q=norm(modal.search);const l=c.filter(a=>!q||norm(fullLabel(a)).includes(q)).sort((x,y)=>titre(x).localeCompare(titre(y),'fr'));
      h+=`<div class="step"><label class="lab" for="m_s">Article</label><input type="search" id="m_s" placeholder="Code ou désignation" value="${esc(modal.search)}">
      <div class="list" id="m_list">${l.map(a=>`<button type="button" data-item="${a.id}" aria-pressed="${modal.item===a.id}">${esc(titre(a))}${detail(a)?` <span class="ref">${esc(detail(a))}</span>`:''}</button>`).join('')||'<div class="empty">Aucun article ne correspond.</div>'}</div></div>`;
      if(modal.item&&!c.some(a=>a.id===modal.item))modal.item=null;}
    else h+='<p class="note">Aucun article dans cette famille. Le responsable logistique peut en ajouter dans le Catalogue.</p>';
  }
  if(modal.item)h+=`<div class="picked">Article choisi : <b>${esc(fullLabel(art(modal.item)))}</b></div>`;
  return h;
}
function preview(){
  const m=modal;if(!m.item)return{html:'Choisissez l’article : la famille d’abord, puis le véhicule ou le code.',lvl:''};
  const id=m.item,q=Math.max(0,parseInt(m.q)||0),cur=qte(id,m.ag);let lines=[],lvl='';
  const chk=(ag,after)=>{const t=seuil(id,ag);
    if(after<0){lvl='bad';return ` Attention : stock négatif à ${ag}.`}
    if(t&&t.min!=null&&after<t.min){lvl=lvl||'warn';return ` Alerte : passe sous le mini (${t.min}).`}
    if(t&&t.max!=null&&after>t.max){lvl=lvl||'warn';return ` Alerte : dépasse le maxi (${t.max}).`}return''};
  if(m.type==='entree')lines.push(`${m.ag} : ${cur} → <b>${cur+q}</b>.`+chk(m.ag,cur+q));
  if(m.type==='sortie')lines.push(`${m.ag} : ${cur} → <b>${cur-q}</b>.`+chk(m.ag,cur-q));
  if(m.type==='inventaire'){const d=q-cur;lines.push(`${m.ag} : ${cur} dans l’outil, ${q} compté(s) en rayon. Écart : <b>${d>0?'+':''}${d}</b>.`+chk(m.ag,q))}
  if(m.type==='transfert'){if(!m.to)lines.push('Choisissez l’agence de destination.');else{const b=qte(id,m.to);
    lines.push(`${m.ag} : ${cur} → <b>${cur-q}</b>.`+chk(m.ag,cur-q));lines.push(`${m.to} : ${b} → <b>${b+q}</b>.`+chk(m.to,b+q))}}
  if(lvl)lines.push('<b>Le mouvement reste possible : l’alerte est seulement informative.</b>');
  return{html:lines.join('<br>'),lvl};
}

  catch(x){$('m_ok').disabled=false;toast('Enregistrement impossible : '+(x.code||x.message))}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal){modal=null;drawModal()}if(editArt){editArt=null;drawArt()}}});

/* ============================================================
   Démarrage
   ============================================================ */
(async()=>{
  try{B=FIREBASE_CONFIG?await FirebaseBackend(FIREBASE_CONFIG):LocalBackend()}
  catch(e){$('app').innerHTML='<div class="login"><h1>Connexion impossible</h1><p class="note">La base de données ne répond pas. Vérifiez votre connexion internet puis rechargez la page.</p></div>';return}
  B.subscribe(d=>{D=d;if(me&&profile&&profile.role!=='attente'&&!modal&&!editArt&&!(document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&document.activeElement.id!=='q'))render()});
  B.onAuth(async u=>{me=u;profile=null;if(!u){render();return}
    try{profile=await B.profile(u)}catch(e){console.error(e);toast('Profil illisible : vérifiez les règles Firestore.');return}
    if(profile.agence){viewAg=profile.agence;seuilAg=profile.agence}render()});
})();
</script>
</body>
</html>
